<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" type="image/png" href="icon-192.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bajón Lunar — Confirma tu dirección</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'DM Sans',-apple-system,sans-serif;}
  body{
    background:radial-gradient(ellipse at top, #12142b 0%, #05060f 60%);
    color:#fff;min-height:100vh;padding:24px 16px 60px;
  }
  .card{
    width:100%;max-width:520px;margin:0 auto;background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:28px 24px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  .logo{font-size:1.3rem;font-weight:800;text-align:center;letter-spacing:1px;}
  .logo span{color:#1A3BFF;}
  .sub{text-align:center;color:#A0A0C0;font-size:.85rem;margin:8px 0 22px;line-height:1.5;}
  label{display:block;font-size:.72rem;letter-spacing:1px;text-transform:uppercase;color:#A0A0C0;margin-bottom:8px;margin-top:16px;}
  input{
    width:100%;padding:13px 15px;border-radius:12px;background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.12);color:#fff;font-size:.95rem;
  }
  input:focus{outline:none;border-color:#1A3BFF;}
  button{
    border:none;border-radius:100px;font-weight:700;cursor:pointer;transition:transform .15s;
  }
  button:active{transform:scale(.97);}
  #btnConfirmar{
    width:100%;margin-top:20px;padding:15px;
    background:linear-gradient(135deg,#1A3BFF,#0A22CC);color:#fff;font-size:.9rem;letter-spacing:1px;
  }
  #btnConfirmar:disabled{opacity:.5;cursor:not-allowed;}
  .dir-ubicacion-btn{
    display:inline-flex;align-items:center;gap:7px;margin-top:10px;
    background:rgba(26,59,255,.12);border:1px solid rgba(26,59,255,.4);border-radius:100px;
    padding:8px 16px;font-size:.78rem;color:#1A3BFF;
  }
  #dirMapa{width:100%;height:280px;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.1);margin-top:14px;}
  .zona-aviso{display:none;font-size:.72rem;padding:6px 12px;border-radius:100px;margin-top:10px;}
  #dirResultados{
    display:none;background:#12131c;border:1px solid rgba(255,255,255,.12);border-radius:10px;
    margin-top:6px;max-height:200px;overflow-y:auto;
  }
  .dir-result-item{padding:10px 14px;font-size:.8rem;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.06);}
  .dir-result-item:hover{background:rgba(255,255,255,.06);}
  .error{color:#f87171;font-size:.82rem;margin-top:14px;display:none;}
  .exito{display:none;text-align:center;padding:30px 10px;}
  .exito .check{font-size:3rem;margin-bottom:10px;}

  .stars-layer{position:fixed;inset:0;pointer-events:none;z-index:0;}
  .star{position:absolute;border-radius:50%;background:white;animation:twinkle var(--d,3s) ease-in-out infinite alternate;animation-delay:var(--delay,0s);}
  @keyframes twinkle{from{opacity:0.05;transform:scale(0.7);}to{opacity:0.6;transform:scale(1.1);}}
  .logo-header{text-align:center;margin-bottom:18px;position:relative;z-index:1;}
  .logo-header img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:1.5px solid rgba(26,59,255,0.4);box-shadow:0 0 24px rgba(26,59,255,0.35);}
  .logo-header .logo-name{font-family:'DM Sans',sans-serif;font-weight:800;letter-spacing:1px;margin-top:8px;font-size:1.05rem;}
  .logo-header .logo-name span{color:#1A3BFF;}
  .card{position:relative;z-index:1;}
</style>
</head>
<body>
<div class="stars-layer" id="starsLayer"></div>

<div class="card">
  <div class="logo-header">
    <img src="logo-bajon-lunar-ae4252.webp" alt="Bajón Lunar">
    <div class="logo-name">BAJÓN <span>LUNAR</span></div>
  </div>
  <div class="sub">Ya con tu anticipo confirmado, solo nos falta la dirección exacta de tu evento para terminar de coordinar todo.</div>

  <div id="formWrap">
    <label>Folio de tu cotización</label>
    <input type="text" id="inFolio" placeholder="BL-0001">

    <label>Busca tu dirección</label>
    <input type="text" id="dirBuscador" placeholder="🔎 Calle, colonia o lugar…" autocomplete="off" oninput="dirBuscarInput()">
    <div id="dirResultados"></div>

    <div id="dirMapa"></div>

    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <button type="button" class="dir-ubicacion-btn" onclick="dirUsarMiUbicacion()">📡 Usar mi ubicación actual</button>
      <span class="zona-aviso" id="dirZonaAviso"></span>
    </div>

    <label>Dirección exacta (puedes editarla)</label>
    <input type="text" id="cDir" placeholder="Calle, número, colonia, alcaldía/municipio…">

    <div class="error" id="errBox"></div>
    <button id="btnConfirmar" onclick="confirmarDireccion()">✅ Confirmar dirección</button>
  </div>

  <div class="exito" id="exitoBox">
    <div class="check">🎉</div>
    <div style="font-size:1.1rem;font-weight:700;margin-bottom:8px;">¡Dirección confirmada!</div>
    <div style="color:#A0A0C0;font-size:.85rem;">Ya quedó registrada. El equipo de Bajón Lunar la va a revisar antes del evento.</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAuGEQjkloYkS3bG8vrW16Rkx719L3ow8o",
  authDomain: "bajon-lunar.firebaseapp.com",
  projectId: "bajon-lunar",
  storageBucket: "bajon-lunar.firebasestorage.app",
  messagingSenderId: "796358723768",
  appId: "1:796358723768:web:cb7d12026b9399a8878c4d",
  measurementId: "G-7FKSVVL775"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Precargar folio desde el link (?folio=BL-0001)
const _folioParam = new URLSearchParams(window.location.search).get('folio');
if (_folioParam) document.getElementById('inFolio').value = _folioParam;

// ════════ MAPA (Leaflet + OpenStreetMap, sin API key) ════════
const ZONA_SERVICIO = { latMin: 18.30, latMax: 20.30, lonMin: -100.60, lonMax: -98.60 };
const CDMX_CENTRO = { lat: 19.4326, lon: -99.1332 };
let _dirMapa = null, _dirMarker = null, _dirBuscarTimeout = null;
let _dirLat = null, _dirLon = null, _dirEstado = null;

function dirEnZonaServicio(lat, lon) {
  return lat >= ZONA_SERVICIO.latMin && lat <= ZONA_SERVICIO.latMax &&
         lon >= ZONA_SERVICIO.lonMin && lon <= ZONA_SERVICIO.lonMax;
}

function dirMostrarZonaAviso(lat, lon) {
  const el = document.getElementById('dirZonaAviso');
  const dentro = dirEnZonaServicio(lat, lon);
  el.style.display = 'inline-block';
  if (dentro) {
    el.textContent = '✅ Dentro de nuestra zona de servicio';
    el.style.background = 'rgba(34,197,94,.12)'; el.style.color = '#4ade80'; el.style.border = '1px solid rgba(34,197,94,.3)';
  } else {
    el.textContent = '⚠️ Fuera de CDMX / Estado de México';
    el.style.background = 'rgba(239,68,68,.12)'; el.style.color = '#f87171'; el.style.border = '1px solid rgba(239,68,68,.3)';
  }
}

function initDirMapa() {
  if (_dirMapa || typeof L === 'undefined') return;
  _dirMapa = L.map('dirMapa').setView([CDMX_CENTRO.lat, CDMX_CENTRO.lon], 10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(_dirMapa);
  _dirMarker = L.marker([CDMX_CENTRO.lat, CDMX_CENTRO.lon], { draggable: true }).addTo(_dirMapa);
  _dirMarker.on('dragend', () => { const p = _dirMarker.getLatLng(); dirGeocodeInverso(p.lat, p.lng); });
  _dirMapa.on('click', (e) => { _dirMarker.setLatLng(e.latlng); dirGeocodeInverso(e.latlng.lat, e.latlng.lng); });
  setTimeout(() => _dirMapa && _dirMapa.invalidateSize(), 200);
}
initDirMapa();

async function dirGeocodeInverso(lat, lon) {
  dirMostrarZonaAviso(lat, lon);
  _dirLat = lat; _dirLon = lon;
  try {
    const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&addressdetails=1&accept-language=es`);
    const data = await resp.json();
    if (data && data.display_name) {
      document.getElementById('cDir').value = data.display_name;
      _dirEstado = (data.address && data.address.state) || null;
    }
  } catch (e) { console.warn(e); }
}

window.dirBuscarInput = function() {
  clearTimeout(_dirBuscarTimeout);
  const q = document.getElementById('dirBuscador').value.trim();
  const resultsEl = document.getElementById('dirResultados');
  if (q.length < 3) { resultsEl.style.display = 'none'; return; }
  _dirBuscarTimeout = setTimeout(async () => {
    try {
      const viewbox = `${ZONA_SERVICIO.lonMin},${ZONA_SERVICIO.latMax},${ZONA_SERVICIO.lonMax},${ZONA_SERVICIO.latMin}`;
      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&countrycodes=mx&viewbox=${viewbox}&bounded=0&limit=6&addressdetails=1&accept-language=es`;
      const resp = await fetch(url);
      const data = await resp.json();
      if (!data || !data.length) {
        resultsEl.innerHTML = '<div style="padding:10px 14px;opacity:0.6;font-size:0.8rem;">Sin resultados.</div>';
        resultsEl.style.display = 'block';
        return;
      }
      resultsEl.innerHTML = data.map((r,i) => `<div class="dir-result-item" data-i="${i}">${r.display_name}</div>`).join('');
      resultsEl.style.display = 'block';
      resultsEl.querySelectorAll('.dir-result-item').forEach((el,i) => { el.onclick = () => dirSeleccionarResultado(data[i]); });
    } catch(e) { console.warn(e); }
  }, 500);
};

function dirSeleccionarResultado(r) {
  const lat = parseFloat(r.lat), lon = parseFloat(r.lon);
  _dirLat = lat; _dirLon = lon;
  _dirEstado = (r.address && r.address.state) || null;
  document.getElementById('cDir').value = r.display_name;
  document.getElementById('dirBuscador').value = '';
  document.getElementById('dirResultados').style.display = 'none';
  if (_dirMapa && _dirMarker) { _dirMapa.setView([lat, lon], 15); _dirMarker.setLatLng([lat, lon]); }
  dirMostrarZonaAviso(lat, lon);
}

window.dirUsarMiUbicacion = function() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition((pos) => {
    const { latitude, longitude } = pos.coords;
    if (_dirMapa && _dirMarker) { _dirMapa.setView([latitude, longitude], 16); _dirMarker.setLatLng([latitude, longitude]); }
    dirGeocodeInverso(latitude, longitude);
  }, (err) => console.warn(err), { timeout: 8000 });
};

document.addEventListener('click', (e) => {
  const box = document.getElementById('dirResultados');
  const input = document.getElementById('dirBuscador');
  if (box && input && !box.contains(e.target) && e.target !== input) box.style.display = 'none';
});

// ════════ CONFIRMAR ════════
window.confirmarDireccion = async function() {
  const errBox = document.getElementById('errBox');
  errBox.style.display = 'none';
  const folio = document.getElementById('inFolio').value.trim().toUpperCase();
  const dir = document.getElementById('cDir').value.trim();
  const btn = document.getElementById('btnConfirmar');

  if (!folio) { errBox.textContent = 'Escribe tu folio (ej. BL-0001)'; errBox.style.display = 'block'; return; }
  if (!dir) { errBox.textContent = 'Escribe o selecciona tu dirección'; errBox.style.display = 'block'; return; }

  btn.disabled = true; btn.textContent = 'Guardando...';
  try {
    // Verificar que el folio exista antes de guardar (evita typos)
    const segRef = doc(db, 'seguimiento_publico', folio);
    const segSnap = await getDoc(segRef);
    if (!segSnap.exists()) {
      errBox.textContent = 'No encontramos ese folio. Revisa que esté bien escrito.';
      errBox.style.display = 'block';
      btn.disabled = false; btn.textContent = '✅ Confirmar dirección';
      return;
    }

    const ref = doc(db, 'direccion_confirmacion', folio);
    await setDoc(ref, {
      folio, dir,
      dirLat: _dirLat, dirLon: _dirLon,
      estadoUbicacion: _dirEstado || '',
      dirMapsUrl: (_dirLat && _dirLon) ? `https://www.google.com/maps?q=${_dirLat},${_dirLon}` : '',
      confirmadoEn: new Date().toISOString(),
      procesado: false,
    });

    document.getElementById('formWrap').style.display = 'none';
    document.getElementById('exitoBox').style.display = 'block';
  } catch (e) {
    console.error(e);
    errBox.textContent = 'Hubo un problema guardando tu dirección. Intenta de nuevo.';
    errBox.style.display = 'block';
    btn.disabled = false; btn.textContent = '✅ Confirmar dirección';
  }
};

// Fondo de estrellas
const starsLayer = document.getElementById('starsLayer');
const starCount = window.innerWidth < 768 ? 40 : 90;
for (let i = 0; i < starCount; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const size = Math.random() * 2 + 0.5;
  s.style.cssText = `width:${size}px;height:${size}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${2+Math.random()*4}s;--delay:${Math.random()*5}s;opacity:${0.1+Math.random()*0.3};`;
  starsLayer.appendChild(s);
}
</script>
</body>
</html>
