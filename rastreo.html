<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" type="image/png" href="icon-192.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bajón Lunar — Rastrea tu cotización</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'DM Sans',-apple-system,sans-serif;}
  body{
    background:radial-gradient(ellipse at top, #12142b 0%, #05060f 60%);
    color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .card{
    width:100%;max-width:460px;background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:32px 26px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  .logo{font-size:1.4rem;font-weight:800;text-align:center;letter-spacing:1px;}
  .logo span{color:#1A3BFF;}
  .sub{text-align:center;color:#A0A0C0;font-size:.85rem;margin:8px 0 26px;}
  label{display:block;font-size:.72rem;letter-spacing:1px;text-transform:uppercase;color:#A0A0C0;margin-bottom:8px;}
  input{
    width:100%;padding:14px 16px;border-radius:12px;background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.12);color:#fff;font-size:1rem;text-transform:uppercase;
  }
  input:focus{outline:none;border-color:#1A3BFF;}
  button{
    width:100%;margin-top:16px;padding:14px;border:none;border-radius:100px;
    background:linear-gradient(135deg,#1A3BFF,#0A22CC);color:#fff;font-weight:700;
    font-size:.9rem;letter-spacing:1px;cursor:pointer;transition:transform .15s;
  }
  button:active{transform:scale(.97);}
  button:disabled{opacity:.5;cursor:not-allowed;}
  #resultado{margin-top:24px;display:none;}
  .estado-pill{
    display:inline-block;padding:6px 16px;border-radius:100px;font-size:.75rem;
    font-weight:700;letter-spacing:.5px;margin-bottom:16px;
  }
  .estado-pendiente{background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid rgba(251,191,36,.3);}
  .estado-confirmado{background:rgba(74,222,128,.15);color:#4ade80;border:1px solid rgba(74,222,128,.3);}
  .estado-contrato_generado{background:rgba(96,207,255,.15);color:#60cfff;border:1px solid rgba(96,207,255,.3);}
  .estado-cancelado{background:rgba(248,113,113,.15);color:#f87171;border:1px solid rgba(248,113,113,.3);}
  .fila{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:.88rem;}
  .fila span:first-child{color:#A0A0C0;}
  .error{color:#f87171;font-size:.82rem;text-align:center;margin-top:14px;display:none;}
  .anticipo-box{margin-top:16px;padding:14px;border-radius:12px;background:rgba(26,59,255,.08);border:1px solid rgba(26,59,255,.25);}
  .wa-btn{
    display:block;text-align:center;margin-top:16px;padding:12px;border-radius:100px;
    background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.35);color:#4ade80;
    text-decoration:none;font-size:.85rem;font-weight:600;
  }

  .stars-layer{position:fixed;inset:0;pointer-events:none;z-index:0;}
  .star{position:absolute;border-radius:50%;background:white;animation:twinkle var(--d,3s) ease-in-out infinite alternate;animation-delay:var(--delay,0s);}
  @keyframes twinkle{from{opacity:0.05;transform:scale(0.7);}to{opacity:0.6;transform:scale(1.1);}}
  .logo-header{text-align:center;margin-bottom:8px;position:relative;z-index:1;}
  .logo-header img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:1.5px solid rgba(26,59,255,0.4);box-shadow:0 0 24px rgba(26,59,255,0.35);}
  .card{position:relative;z-index:1;}
</style>
</head>
<body>
<div class="stars-layer" id="starsLayer"></div>

<div class="card">
  <div class="logo-header"><img src="logo-bajon-lunar-ae4252.webp" alt="Bajón Lunar"></div>
  <div class="logo">BAJÓN <span>LUNAR</span></div>
  <div class="sub">Rastrea el estado de tu cotización</div>

  <label>Folio de tu cotización</label>
  <input type="text" id="inFolio" placeholder="BL-0001" maxlength="20" onkeydown="if(event.key==='Enter') buscar()">
  <button id="btnBuscar" onclick="buscar()">🔎 Buscar</button>
  <div class="error" id="errBox"></div>

  <div id="resultado"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAuGEQjkloYkS3bG8vrW16Rkx719L3ow8o",
  authDomain: "bajon-lunar.firebaseapp.com",
  projectId: "bajon-lunar",
  storageBucket: "bajon-lunar.firebasestorage.app",
  messagingSenderId: "796358723768",
  appId: "1:796358723768:web:cb7d12026b9399a8878c4d",
  measurementId: "G-7FKSVVL775"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const ESTADOS = {
  pendiente:          { label: '⏳ Pendiente de confirmación', clase: 'estado-pendiente' },
  confirmado:         { label: '✅ Confirmado',                clase: 'estado-confirmado' },
  contrato_generado:  { label: '📄 Contrato generado',          clase: 'estado-contrato_generado' },
  cancelado:          { label: '❌ Cancelado',                  clase: 'estado-cancelado' },
};

window.buscar = async function() {
  const folioInput = document.getElementById('inFolio');
  const folio = folioInput.value.trim().toUpperCase();
  const errBox = document.getElementById('errBox');
  const resultado = document.getElementById('resultado');
  const btn = document.getElementById('btnBuscar');
  errBox.style.display = 'none';
  resultado.style.display = 'none';

  if (!folio) {
    errBox.textContent = 'Escribe tu número de folio (ej. BL-0001)';
    errBox.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = '🔎 Buscando...';

  try {
    const ref = doc(db, 'seguimiento_publico', folio);
    const snap = await getDoc(ref);

    if (!snap.exists()) {
      errBox.textContent = 'No encontramos ese folio. Revisa que esté bien escrito (ej. BL-0001).';
      errBox.style.display = 'block';
      return;
    }

    const d = snap.data();
    const estadoInfo = ESTADOS[d.estado] || ESTADOS.pendiente;
    const antPct = d.anticipoPct || 50;
    const antMonto = parseFloat(d.anticipoMonto || 0);
    const total = parseFloat(d.total || 0);
    const saldo = Math.max(0, total - antMonto);

    let fechaTexto = '—';
    if (d.fecha) {
      try {
        fechaTexto = new Date(d.fecha + 'T12:00').toLocaleDateString('es-MX', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
      } catch(e) { fechaTexto = d.fecha; }
    }

    resultado.innerHTML = `
      <span class="estado-pill ${estadoInfo.clase}">${estadoInfo.label}</span>
      <div class="fila"><span>Folio</span><span>${d.folio}</span></div>
      <div class="fila"><span>Cliente</span><span>${d.nombre || '—'}</span></div>
      <div class="fila"><span>Fecha del evento</span><span>${fechaTexto}</span></div>
      <div class="fila"><span>Hora</span><span>${d.hora || '—'}</span></div>
      <div class="fila"><span>Paquete</span><span>${d.paqueteNombre || '—'}</span></div>
      <div class="fila"><span>Barra</span><span>${d.barraTexto || '—'}</span></div>
      <div class="fila"><span>Total</span><span>$${total.toLocaleString('es-MX',{minimumFractionDigits:2})}</span></div>
      <div class="anticipo-box">
        <div class="fila" style="border:none;"><span>Anticipo (${antPct}%)</span><span>$${antMonto.toLocaleString('es-MX',{minimumFractionDigits:2})}</span></div>
        <div class="fila" style="border:none;"><span>${d.anticipoRecibido ? '✅ Anticipo recibido' : '⏳ Anticipo pendiente'}</span><span></span></div>
        <div class="fila" style="border:none;"><span>Saldo restante</span><span>$${saldo.toLocaleString('es-MX',{minimumFractionDigits:2})}</span></div>
      </div>
      <a class="wa-btn" href="https://wa.me/525571901664?text=${encodeURIComponent('Hola, tengo una pregunta sobre mi cotización ' + d.folio)}" target="_blank">💬 Escribir por WhatsApp sobre este folio</a>
    `;
    resultado.style.display = 'block';
  } catch (e) {
    console.error(e);
    errBox.textContent = 'Hubo un problema buscando tu cotización. Intenta de nuevo en un momento.';
    errBox.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = '🔎 Buscar';
  }
};

// Si el link trae ?folio=BL-0001, precargar y buscar automático
const _folioParam = new URLSearchParams(window.location.search).get('folio');
if (_folioParam) {
  document.getElementById('inFolio').value = _folioParam;
  window.buscar();
}

// Fondo de estrellas
const starsLayer = document.getElementById('starsLayer');
const starCount = window.innerWidth < 768 ? 40 : 90;
for (let i = 0; i < starCount; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const size = Math.random() * 2 + 0.5;
  s.style.cssText = `width:${size}px;height:${size}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${2+Math.random()*4}s;--delay:${Math.random()*5}s;opacity:${0.1+Math.random()*0.3};`;
  starsLayer.appendChild(s);
}
</script>
</body>
</html>
